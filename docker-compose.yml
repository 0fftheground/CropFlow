services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CROPFLOW_POSTGRES_DB:-cropflow_demo}
      POSTGRES_USER: ${CROPFLOW_POSTGRES_USER:-cropflow}
      POSTGRES_PASSWORD: ${CROPFLOW_POSTGRES_PASSWORD:-cropflow}
    ports:
      - "${CROPFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - cropflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CROPFLOW_POSTGRES_USER:-cropflow} -d ${CROPFLOW_POSTGRES_DB:-cropflow_demo}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
    image: cropflow-demo:latest
    restart: unless-stopped
    environment:
      CROPFLOW_APP_NAME: ${CROPFLOW_APP_NAME:-CropFlow API}
      CROPFLOW_ENVIRONMENT: ${CROPFLOW_ENVIRONMENT:-production}
      CROPFLOW_DEBUG: ${CROPFLOW_DEBUG:-false}
      CROPFLOW_SQL_ECHO: ${CROPFLOW_SQL_ECHO:-false}
      CROPFLOW_REQUIRE_REAL_INTEGRATIONS: ${CROPFLOW_REQUIRE_REAL_INTEGRATIONS:-true}
      CROPFLOW_DATABASE_URL: ${CROPFLOW_DATABASE_URL:-postgresql+psycopg://cropflow:cropflow@db:5432/cropflow_demo}
      CROPFLOW_BACKGROUND_JOBS_ENABLED: "false"
      CROPFLOW_SURVEY_RECOMMENDATION_INTERVAL_SECONDS: ${CROPFLOW_SURVEY_RECOMMENDATION_INTERVAL_SECONDS:-300}
      CROPFLOW_TASK_DUE_CHECK_INTERVAL_SECONDS: ${CROPFLOW_TASK_DUE_CHECK_INTERVAL_SECONDS:-300}
      CROPFLOW_WEATHER_CHECK_INTERVAL_SECONDS: ${CROPFLOW_WEATHER_CHECK_INTERVAL_SECONDS:-300}
      CROPFLOW_WEED_DIAGNOSIS_BASE_URL: ${CROPFLOW_WEED_DIAGNOSIS_BASE_URL:?Set CROPFLOW_WEED_DIAGNOSIS_BASE_URL}
      CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL: ${CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL:?Set CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL}
      CROPFLOW_PEST_DISEASE_CONTROL_BASE_URL: ${CROPFLOW_PEST_DISEASE_CONTROL_BASE_URL:-}
      CROPFLOW_STAGE_PREDICTION_BASE_URL: ${CROPFLOW_STAGE_PREDICTION_BASE_URL:?Set CROPFLOW_STAGE_PREDICTION_BASE_URL}
      CROPFLOW_WEATHER_API_BASE_URL: ${CROPFLOW_WEATHER_API_BASE_URL:?Set CROPFLOW_WEATHER_API_BASE_URL}
      CROPFLOW_WEATHER_API_TOKEN: ${CROPFLOW_WEATHER_API_TOKEN:?Set CROPFLOW_WEATHER_API_TOKEN}
      CROPFLOW_WEATHER_ALERT_API_BASE_URL: ${CROPFLOW_WEATHER_ALERT_API_BASE_URL:-}
      CROPFLOW_WEATHER_ALERT_API_TOKEN: ${CROPFLOW_WEATHER_ALERT_API_TOKEN:-}
      CROPFLOW_WEATHER_API_TIMEOUT_SECONDS: ${CROPFLOW_WEATHER_API_TIMEOUT_SECONDS:-10}
      CROPFLOW_WEATHER_CLIMATOLOGY_REFERENCE_YEARS: ${CROPFLOW_WEATHER_CLIMATOLOGY_REFERENCE_YEARS:-3}
      CROPFLOW_LOG_DIR: /app/logs
      CROPFLOW_LOG_LEVEL: ${CROPFLOW_LOG_LEVEL:-INFO}
      CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS: ${CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS:-90}
      CROPFLOW_RUN_MIGRATIONS_ON_START: ${CROPFLOW_RUN_MIGRATIONS_ON_START:-true}
      CROPFLOW_API_PORT: "8000"
    ports:
      - "${CROPFLOW_API_PORT:-8000}:8000"
    volumes:
      - cropflow_logs:/app/logs
    command: ["api"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build:
      context: .
    image: cropflow-demo:latest
    restart: unless-stopped
    profiles: ["jobs"]
    environment:
      CROPFLOW_APP_NAME: ${CROPFLOW_APP_NAME:-CropFlow API}
      CROPFLOW_ENVIRONMENT: ${CROPFLOW_ENVIRONMENT:-production}
      CROPFLOW_DEBUG: ${CROPFLOW_DEBUG:-false}
      CROPFLOW_SQL_ECHO: ${CROPFLOW_SQL_ECHO:-false}
      CROPFLOW_REQUIRE_REAL_INTEGRATIONS: ${CROPFLOW_REQUIRE_REAL_INTEGRATIONS:-true}
      CROPFLOW_DATABASE_URL: ${CROPFLOW_DATABASE_URL:-postgresql+psycopg://cropflow:cropflow@db:5432/cropflow_demo}
      CROPFLOW_BACKGROUND_JOBS_ENABLED: "true"
      CROPFLOW_SURVEY_RECOMMENDATION_INTERVAL_SECONDS: ${CROPFLOW_SURVEY_RECOMMENDATION_INTERVAL_SECONDS:-300}
      CROPFLOW_TASK_DUE_CHECK_INTERVAL_SECONDS: ${CROPFLOW_TASK_DUE_CHECK_INTERVAL_SECONDS:-300}
      CROPFLOW_WEATHER_CHECK_INTERVAL_SECONDS: ${CROPFLOW_WEATHER_CHECK_INTERVAL_SECONDS:-300}
      CROPFLOW_WEED_DIAGNOSIS_BASE_URL: ${CROPFLOW_WEED_DIAGNOSIS_BASE_URL:?Set CROPFLOW_WEED_DIAGNOSIS_BASE_URL}
      CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL: ${CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL:?Set CROPFLOW_PEST_DISEASE_SURVEY_BASE_URL}
      CROPFLOW_PEST_DISEASE_CONTROL_BASE_URL: ${CROPFLOW_PEST_DISEASE_CONTROL_BASE_URL:-}
      CROPFLOW_STAGE_PREDICTION_BASE_URL: ${CROPFLOW_STAGE_PREDICTION_BASE_URL:?Set CROPFLOW_STAGE_PREDICTION_BASE_URL}
      CROPFLOW_WEATHER_API_BASE_URL: ${CROPFLOW_WEATHER_API_BASE_URL:?Set CROPFLOW_WEATHER_API_BASE_URL}
      CROPFLOW_WEATHER_API_TOKEN: ${CROPFLOW_WEATHER_API_TOKEN:?Set CROPFLOW_WEATHER_API_TOKEN}
      CROPFLOW_WEATHER_ALERT_API_BASE_URL: ${CROPFLOW_WEATHER_ALERT_API_BASE_URL:-}
      CROPFLOW_WEATHER_ALERT_API_TOKEN: ${CROPFLOW_WEATHER_ALERT_API_TOKEN:-}
      CROPFLOW_WEATHER_API_TIMEOUT_SECONDS: ${CROPFLOW_WEATHER_API_TIMEOUT_SECONDS:-10}
      CROPFLOW_WEATHER_CLIMATOLOGY_REFERENCE_YEARS: ${CROPFLOW_WEATHER_CLIMATOLOGY_REFERENCE_YEARS:-3}
      CROPFLOW_LOG_DIR: /app/logs
      CROPFLOW_LOG_LEVEL: ${CROPFLOW_LOG_LEVEL:-INFO}
      CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS: ${CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS:-90}
      CROPFLOW_RUN_MIGRATIONS_ON_START: "false"
    volumes:
      - cropflow_logs:/app/logs
    command: ["scheduler"]

  seed:
    build:
      context: .
    image: cropflow-demo:latest
    restart: "no"
    profiles: ["tools"]
    environment:
      CROPFLOW_APP_NAME: ${CROPFLOW_APP_NAME:-CropFlow API}
      CROPFLOW_ENVIRONMENT: ${CROPFLOW_ENVIRONMENT:-production}
      CROPFLOW_DEBUG: ${CROPFLOW_DEBUG:-false}
      CROPFLOW_SQL_ECHO: ${CROPFLOW_SQL_ECHO:-false}
      CROPFLOW_REQUIRE_REAL_INTEGRATIONS: "false"
      CROPFLOW_DATABASE_URL: ${CROPFLOW_DATABASE_URL:-postgresql+psycopg://cropflow:cropflow@db:5432/cropflow_demo}
      CROPFLOW_BACKGROUND_JOBS_ENABLED: "false"
      CROPFLOW_LOG_DIR: /app/logs
      CROPFLOW_LOG_LEVEL: ${CROPFLOW_LOG_LEVEL:-INFO}
      CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS: ${CROPFLOW_WAIT_FOR_DB_TIMEOUT_SECONDS:-90}
      CROPFLOW_RUN_MIGRATIONS_ON_START: "true"
    volumes:
      - cropflow_logs:/app/logs
    command: ["seed"]

volumes:
  cropflow_postgres_data:
  cropflow_logs:
